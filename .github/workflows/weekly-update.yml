name: Weekly Skills Update

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run skills updater
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/update_skills.py

      - name: Commit and push changes if updated
        run: |
          git config user.name "Changhyeok Bae"
          git config user.email "changhyeok.bae@gmail.com"
          if [ -n "$(git status --porcelain data/)" ]; then
            git add data/
            git commit -m "chore(data): update weekly ai skills metrics" -m "Automated weekly update of GitHub stars, weekly delta, and snapshots."
            git push origin main
          else
            echo "No data changes detected. Skipping commit."
          fi
